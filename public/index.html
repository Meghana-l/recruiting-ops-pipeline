<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recruiting Pipeline Dashboard</title>
<style>
  :root{
    --bg:#f7f8f7; --card:#fff; --ink:#1a2322; --muted:#5f6d6b; --line:#e2e6e3;
    --accent:#0f5e53; --warn:#a9680b; --bad:#9e3224;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  header{background:#fff;border-bottom:1px solid var(--line);padding:22px 24px}
  .wrap{max-width:1060px;margin:0 auto}
  h1{margin:0;font-size:20px}
  header p{margin:5px 0 0;color:var(--muted);font-size:14px}
  main{padding:26px 24px 60px}
  h2{font-size:16px;margin:32px 0 12px}
  h2:first-of-type{margin-top:8px}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:14px 16px}
  .num{font-size:26px;font-weight:600;letter-spacing:-.5px}
  .lab{color:var(--muted);font-size:13px;margin-top:2px}
  .panels{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
  .bar-row{margin-bottom:10px}
  .bar-top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:3px}
  .bar-top span:last-child{color:var(--muted)}
  .track{height:15px;background:#eceeec;border-radius:3px;overflow:hidden}
  .fill{height:100%;background:var(--accent);border-radius:3px}
  table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:6px;font-size:13.5px}
  th{text-align:left;padding:9px 12px;background:#f1f3f1;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--muted);font-weight:600}
  td{padding:8px 12px;border-bottom:1px solid #f0f2f0}
  tr:last-child td{border-bottom:none}
  .tbl{overflow-x:auto}
  .tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px}
  .tag.ok{background:#e4efec;color:var(--accent)}
  .tag.warn{background:#fbf0dc;color:var(--warn)}
  .tag.bad{background:#fae7e4;color:var(--bad)}
  .note{color:var(--muted);font-size:13.5px;margin:0 0 14px;max-width:80ch}
  .check{display:flex;gap:10px;align-items:baseline;padding:9px 0;border-bottom:1px solid #f0f2f0}
  .check:last-child{border-bottom:none}
  .check .nm{flex:1}
  .check .why{color:var(--muted);font-size:13px}
  footer{border-top:1px solid var(--line);margin-top:40px;padding:18px 24px;color:var(--muted);font-size:13px}
  a{color:var(--accent)}
  @media(max-width:600px){.num{font-size:22px}main{padding:20px 16px 50px}header{padding:18px 16px}}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <h1>Recruiting Pipeline Dashboard</h1>
    <p>Built from 444 raw Lever applications joined to Workday requisitions. Data is synthetic.</p>
  </div>
</header>

<main class="wrap">
  <div id="app">Loading…</div>
</main>

<footer>
  <div class="wrap">
    Synthetic data generated for a portfolio project.
    Pipeline source on <a href="https://github.com/Meghana-l" id="repo">GitHub</a>.
  </div>
</footer>

<script>
const fmt = n => n.toLocaleString();

fetch('data.json')
  .then(r => r.json())
  .then(render)
  .catch(() => {
    document.getElementById('app').innerHTML =
      '<p class="note">Could not load data.json. Run <code>python src/build_dashboard.py</code> first.</p>';
  });

function render(d) {
  const s = d.summary;
  const maxFunnel = Math.max(...d.funnel.map(f => f.reached));
  const maxRate = Math.max(...d.sources.map(x => x.hire_rate), 1);
  const maxDays = Math.max(...d.time_to_hire_by_department.map(x => x.median_days), 1);

  document.getElementById('app').innerHTML = `
    <div class="cards">
      ${card(fmt(s.applications), 'Applications')}
      ${card(s.open_requisitions, 'Open requisitions')}
      ${card(s.median_time_to_hire + 'd', 'Median time to hire')}
      ${card(s.offer_acceptance + '%', 'Offer acceptance')}
      ${card(s.past_sla, 'Candidates past SLA')}
    </div>

    <h2>Pipeline funnel</h2>
    <p class="note">Candidates who reached each stage, and the share that carried over from the stage before.</p>
    <div class="card">
      ${d.funnel.map(f => bar(
        f.stage,
        fmt(f.reached) + (f.conversion !== null ? ` · ${f.conversion}%` : ''),
        100 * f.reached / maxFunnel
      )).join('')}
    </div>

    <div class="panels">
      <div>
        <h2>Source effectiveness</h2>
        <p class="note">Share of applications from each channel that ended in a hire.</p>
        <div class="card">
          ${d.sources.map(x => bar(
            x.source, `${x.hire_rate}% · ${x.hires}/${x.applications}`,
            Math.max(1.5, 100 * x.hire_rate / maxRate)
          )).join('')}
        </div>
      </div>
      <div>
        <h2>Time to hire by department</h2>
        <p class="note">Median days from application to accepted offer.</p>
        <div class="card">
          ${d.time_to_hire_by_department.map(x => bar(
            x.department, `${x.median_days}d · ${x.hires} hire${x.hires === 1 ? '' : 's'}`,
            100 * x.median_days / maxDays
          )).join('')}
        </div>
      </div>
    </div>

    <h2>Candidates stuck past their stage SLA</h2>
    <p class="note">No activity in more than twice the target for their stage. This is the list a recruiting lead would work through on a Monday.</p>
    <div class="tbl">
      <table>
        <thead><tr>
          <th>Candidate</th><th>Role</th><th>Department</th>
          <th>Stage</th><th>Recruiter</th><th>Days idle</th><th>Target</th>
        </tr></thead>
        <tbody>
          ${d.stuck_candidates.map(c => `<tr>
            <td>${c.candidate_name}</td>
            <td>${c.title}</td>
            <td>${c.department}</td>
            <td>${c.stage}</td>
            <td>${c.recruiter}</td>
            <td><span class="tag bad">${c.days_in_stage}d</span></td>
            <td>${c.stage_sla_days}d</td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>

    <h2>Data quality checks</h2>
    <p class="note">Run against the cleaned dataset on every pipeline run. The two warnings are deliberate — they are problems to fix at the source, not things a pipeline should quietly paper over.</p>
    <div class="card">
      ${d.quality.map(q => `
        <div class="check">
          <span class="tag ${q.passed ? 'ok' : (q.severity === 'blocking' ? 'bad' : 'warn')}">
            ${q.passed ? 'pass' : q.failing_rows + ' row' + (q.failing_rows === 1 ? '' : 's')}
          </span>
          <span class="nm">${q.name}<br><span class="why">${q.passed ? q.why : q.action}</span></span>
        </div>`).join('')}
    </div>
  `;
}

function card(num, lab) {
  return `<div class="card"><div class="num">${num}</div><div class="lab">${lab}</div></div>`;
}

function bar(label, value, pct) {
  return `<div class="bar-row">
    <div class="bar-top"><span>${label}</span><span>${value}</span></div>
    <div class="track"><div class="fill" style="width:${pct}%"></div></div>
  </div>`;
}
</script>
</body>
</html>
